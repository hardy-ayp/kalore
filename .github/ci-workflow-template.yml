# Kalore GitHub Actions CI Workflow Template
# To enable this workflow on GitHub Actions, move this file to .github/workflows/ci.yml

name: Kalore CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  analyze_and_test:
    name: Flutter Analyze & Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Verify Flutter Version
        run: flutter --version

      - name: Install Dependencies
        working-directory: ./kalore
        run: flutter pub get

      - name: Static Code Analysis (0 Issues Policy)
        working-directory: ./kalore
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Run Automated Test Suite
        working-directory: ./kalore
        run: flutter test --coverage
